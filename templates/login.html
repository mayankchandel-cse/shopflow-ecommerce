{% extends "base.html" %}
{% block title %}Login — ShopFlow{% endblock %}
{% block content %}
<h1>Login</h1>
<form class="form narrow" method="post" action="{{ url_for('login') }}">
  <label>Email<input type="email" name="email" required></label>
  <label>Password<input type="password" name="password" required></label>
  <button class="btn" type="submit">Login</button>
</form>
<p>Demo accounts — Admin: admin@shopflow.com / admin123 &nbsp;·&nbsp; Customer: demo@shopflow.com / demo123</p>
<p>No account? <a href="{{ url_for('register') }}">Sign up</a></p>
{% endblock %}
