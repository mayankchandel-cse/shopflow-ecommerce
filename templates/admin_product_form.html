{% extends "base.html" %}
{% block title %}{{ 'Edit Product' if product else 'Add Product' }} — ShopFlow{% endblock %}
{% block content %}
<h1>{{ 'Edit Product' if product else 'Add Product' }}</h1>
<form class="form" method="post">
  <label>Name *<input type="text" name="name" required value="{{ product.name if product }}"></label>
  <label>Description<textarea name="description" rows="4">{{ product.description if product }}</textarea></label>
  <label>Price (₹) *<input type="number" step="0.01" min="0" name="price" required value="{{ product.price if product }}"></label>
  <label>Old price (₹, optional)<input type="number" step="0.01" min="0" name="old_price" value="{{ product.old_price if product and product.old_price }}"></label>
  <label>Category *
    <select name="category">
      {% for c in ['Electronics','Fashion','Home & Living','Sports & Fitness'] %}
      <option {% if product and product.category == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Stock *<input type="number" min="0" name="stock" required value="{{ product.stock if product else 10 }}"></label>
  <label>Rating<input type="number" step="0.1" min="0" max="5" name="rating" value="{{ product.rating if product else 4.5 }}"></label>
  <button class="btn" type="submit">Save Product</button>
  <a class="btn ghost" href="{{ url_for('admin_products') }}">Cancel</a>
</form>
{% endblock %}
